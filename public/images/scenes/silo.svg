<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#f4f1fb"/>
  <rect x="0" y="430" width="800" height="70" fill="#e6dff6"/>

  <!-- silo body -->
  <path d="M 300 130
           L 500 130
           L 500 300
           L 420 400
           L 380 400
           L 300 300
           Z"
        fill="#ffffff" stroke="#442a71" stroke-width="5" stroke-linejoin="round"/>
  <rect x="386" y="400" width="28" height="30" fill="#c9b9ec"/>

  <!-- granular pile inside (cutaway) -->
  <path d="M 312 200
           C 350 170, 450 170, 488 200
           L 488 296
           L 416 392
           L 384 392
           L 312 296
           Z"
        fill="#e8792a" opacity="0.85"/>
  <circle cx="350" cy="210" r="7" fill="#f3a25e"/>
  <circle cx="400" cy="195" r="9" fill="#f3a25e"/>
  <circle cx="450" cy="212" r="6" fill="#f3a25e"/>
  <circle cx="375" cy="230" r="6" fill="#ad4d15"/>
  <circle cx="430" cy="235" r="7" fill="#ad4d15"/>

  <!-- sensor + cone -->
  <rect x="384" y="66" width="32" height="26" rx="6" fill="#241645"/>
  <rect x="396" y="92" width="8" height="38" fill="#241645"/>
  <polygon points="400,130 320,200 480,200" fill="#f3a25e" opacity="0.35"/>
  <circle cx="400" cy="195" r="5" fill="#241645"/>
</svg>
